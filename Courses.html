<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses - Donation Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="courses">
    <header class="navbar">
        <h2>Donation Management System</h2>
        <nav>
            <a href="index.html">Donors</a>
            <a href="Campaigns.html">Campaigns</a>
            <a href="Donations.html">Donations</a>
            <a href="beneficiaries.html">Beneficiaries</a>
            <a href="Courses.html" class="active">Courses</a>
            <a href="Enrollments.html">Enrollments</a>
        </nav>
        <div class="session-controls" data-session-controls></div>
    </header>

    <main class="container">
        <section class="card" data-admin-only>
            <h3>Course Management</h3>
            <form id="record-form">
                <div class="form-group">
                    <label for="courseName">Course Name</label>
                    <input type="text" id="courseName" name="courseName" maxlength="100" placeholder="e.g. BSIT" required>
                </div>
                <button type="submit" class="btn">Add Course</button>
                <button type="button" class="btn secondary-button" data-cancel-edit hidden>Cancel</button>
            </form>
        </section>

        <section class="card">
            <h3>Available Courses</h3>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Course</th>
                        <th data-admin-only>Actions</th>
                    </tr>
                </thead>
                <tbody id="records-table"></tbody>
            </table>
        </section>
    </main>

    <script src="api-config.js"></script>
    <script src="app.js" defer></script>
</body>
</html>
