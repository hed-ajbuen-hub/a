<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Enrollment - Donation Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="enrollments">
    <header class="navbar">
        <h2>Donation Management System</h2>
        <nav>
            <a href="index.html">Donors</a>
            <a href="Campaigns.html">Campaigns</a>
            <a href="Donations.html">Donations</a>
            <a href="beneficiaries.html">Beneficiaries</a>
            <a href="Courses.html">Courses</a>
            <a href="Enrollments.html" class="active">Enrollments</a>
        </nav>
        <div class="session-controls" data-session-controls></div>
    </header>

    <main class="container">
        <section class="card">
            <h3>Student Enrollment</h3>
            <form id="record-form">
                <div class="form-group">
                    <label for="studentName">Student Name</label>
                    <input type="text" id="studentName" name="studentName" maxlength="150" required>
                </div>

                <div class="form-group">
                    <label for="collegeId">College ID</label>
                    <input type="text" id="collegeId" name="collegeId" maxlength="50" required>
                </div>

                <div class="form-group">
                    <label for="courseId">Course</label>
                    <select id="courseId" name="courseId" required>
                        <option value="">Select a course</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="enrollmentDate">Enrollment Date</label>
                    <input type="date" id="enrollmentDate" name="enrollmentDate" required>
                </div>

                <button type="submit" class="btn">Save Enrollment</button>
                <button type="button" class="btn secondary-button" data-cancel-edit hidden>Cancel</button>
            </form>
        </section>

        <section class="card">
            <h3>Enrollment Records</h3>
            <table>
                <thead>
                    <tr>
                        <th>Student Name</th>
                        <th>College ID</th>
                        <th>Course</th>
                        <th>Enrollment Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="records-table"></tbody>
            </table>
        </section>
    </main>

    <script src="api-config.js"></script>
    <script src="app.js" defer></script>
</body>
</html>
